name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Compilar APK Kivy
      uses: Digreatbrian/buildozer-action@v1
      with:
        workdir: .

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
